<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" width="1100" height="540" viewBox="0 0 1100 540"><ns0:defs><ns0:marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><ns0:path d="M0,0 L8,4 L0,8 Z" fill="#17324d" /></ns0:marker></ns0:defs><ns0:g font-family="Noto Sans CJK KR, sans-serif" fill="#17324d"><ns0:text x="38" y="44" font-size="27" text-anchor="start" font-weight="700" fill="#17324d">노트북 파일과 실행 중인 메모리는 다릅니다</ns0:text><ns0:text x="38" y="77" font-size="16" text-anchor="start" font-weight="400" fill="#4c6178">1교시 · Windows 11 실행 흐름: 코드를 보는 곳, 실행하는 곳, 저장되는 것을 분리하기</ns0:text><ns0:rect x="40" y="135" width="260" height="145" rx="12" fill="#e6f1fc" stroke="#b4c9df" /><ns0:text x="170.0" y="187.5" font-size="18" text-anchor="middle" font-weight="600" fill="#17324d">노트북 화면 · .ipynb</ns0:text><ns0:text x="170.0" y="213.5" font-size="18" text-anchor="middle" font-weight="400" fill="#17324d">코드 셀 + 설명 셀</ns0:text><ns0:text x="170.0" y="239.5" font-size="18" text-anchor="middle" font-weight="400" fill="#17324d">저장된 실행 출력</ns0:text><ns0:rect x="400" y="135" width="285" height="145" rx="12" fill="#e6f1fc" stroke="#b4c9df" /><ns0:text x="542.5" y="187.5" font-size="18" text-anchor="middle" font-weight="600" fill="#17324d">커널 · Python 프로세스</ns0:text><ns0:text x="542.5" y="213.5" font-size="18" text-anchor="middle" font-weight="400" fill="#17324d">변수 / 불러온 패키지 / 모델</ns0:text><ns0:text x="542.5" y="239.5" font-size="18" text-anchor="middle" font-weight="400" fill="#17324d">현재 세션의 메모리에 유지</ns0:text><ns0:rect x="790" y="115" width="265" height="85" rx="12" fill="#e6f1fc" stroke="#b4c9df" /><ns0:text x="922.5" y="150.5" font-size="18" text-anchor="middle" font-weight="600" fill="#17324d">환경 점검</ns0:text><ns0:text x="922.5" y="176.5" font-size="18" text-anchor="middle" font-weight="400" fill="#17324d">Python·패키지 확인</ns0:text><ns0:rect x="790" y="225" width="265" height="85" rx="12" fill="#e6f1fc" stroke="#b4c9df" /><ns0:text x="922.5" y="260.5" font-size="18" text-anchor="middle" font-weight="600" fill="#17324d">GPU · CUDA 연산</ns0:text><ns0:text x="922.5" y="286.5" font-size="18" text-anchor="middle" font-weight="400" fill="#17324d">CUDA 장치에서 텐서 계산</ns0:text><ns0:path d="M300,175 L400,175" fill="none" stroke="#17324d" stroke-width="2.2" marker-end="url(#arrow)" /><ns0:text x="350" y="157" font-size="16" text-anchor="middle" font-weight="400" fill="#17324d">셀 실행</ns0:text><ns0:path d="M400,245 L300,245" fill="none" stroke="#17324d" stroke-width="2.2" marker-end="url(#arrow)" /><ns0:text x="350" y="270" font-size="16" text-anchor="middle" font-weight="400" fill="#17324d">출력 반환</ns0:text><ns0:path d="M685,170 L790,155" fill="none" stroke="#17324d" stroke-width="2.2" marker-end="url(#arrow)" /><ns0:path d="M685,235 L790,265" fill="none" stroke="#17324d" stroke-width="2.2" marker-end="url(#arrow)" /><ns0:rect x="400" y="335" width="655" height="76" rx="12" fill="#ffffff" stroke="#b4c9df" /><ns0:text x="727.5" y="379.0" font-size="17" text-anchor="middle" font-weight="600" fill="#17324d">실행 환경: Python + 설치 패키지 + 사용 가능한 장치</ns0:text><ns0:text x="42" y="340" font-size="17" text-anchor="start" font-weight="400" fill="#17324d">노트북 화면: 현재 열어 본 파일</ns0:text><ns0:text x="42" y="370" font-size="17" text-anchor="start" font-weight="400" fill="#17324d">커널: 코드를 실행하고 변수 유지</ns0:text><ns0:text x="42" y="402" font-size="16" text-anchor="start" font-weight="400" fill="#4c6178">화면과 실행 상태는 구분합니다.</ns0:text><ns0:rect x="30" y="447" width="1040" height="74" rx="12" fill="#fff0d4" /><ns0:text x="48" y="475" font-size="17" text-anchor="start" font-weight="600" fill="#17324d">파일을 저장해도 실행 메모리 전체가 저장되는 것은 아닙니다.</ns0:text><ns0:text x="48" y="503" font-size="16" text-anchor="start" font-weight="400" fill="#4c6178">커널 재시작 후에는 변수가 사라집니다. 저장된 출력이 보여도 필요한 셀은 위에서부터 다시 실행하세요.</ns0:text></ns0:g></ns0:svg>