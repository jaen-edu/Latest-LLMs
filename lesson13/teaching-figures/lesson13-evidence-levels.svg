<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="540" viewBox="0 0 1100 540"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#17324d" /></marker></defs><g font-family="Noto Sans CJK KR, sans-serif"><text x="34" y="48" font-size="27" font-weight="700" fill="#17324d">같은 모델도, 근거에 따라 말할 수 있는 범위가 다릅니다</text><text x="34" y="80" font-size="17" font-weight="400" fill="#506477">공개 자료 → 구현 확인 → 실행 관찰: 앞 단계의 증거가 다음 단계의 결론을 대신하지 않습니다.</text><rect x="34" y="112" width="320" height="238" rx="12" fill="#e6f1fc" stroke="#b4c9df" stroke-width="1.2" /><text x="52" y="145" font-size="21" font-weight="700" fill="#17324d">① 문서 · 공개 config</text><text x="52" y="182" font-size="18" font-weight="400" fill="#17324d">설계 설명과 설정값</text><text x="52" y="221" font-size="20" font-weight="700" fill="#17324d">KV 헤드 수 = 8</text><text x="52" y="270" font-size="17" font-weight="400" fill="#17324d">확인: 특정 체크포인트의 구조</text><text x="52" y="306" font-size="17" font-weight="400" fill="#506477">아직 모름: 내 장비의 속도</text><rect x="390" y="112" width="320" height="238" rx="12" fill="#e6f1fc" stroke="#b4c9df" stroke-width="1.2" /><text x="408" y="145" font-size="21" font-weight="700" fill="#17324d">② 구현 · 소스 코드</text><text x="408" y="182" font-size="18" font-weight="400" fill="#17324d">실제 계산 규칙과 경로</text><text x="408" y="221" font-size="20" font-weight="700" fill="#17324d">K/V를 어떻게 저장하는가?</text><text x="408" y="270" font-size="17" font-weight="400" fill="#17324d">확인: 구현된 연산·캐시 방식</text><text x="408" y="306" font-size="17" font-weight="400" fill="#506477">아직 모름: 이번 입력의 결과</text><rect x="746" y="112" width="320" height="238" rx="12" fill="#e6f1fc" stroke="#b4c9df" stroke-width="1.2" /><text x="764" y="145" font-size="21" font-weight="700" fill="#17324d">③ 실행 · 저장된 출력</text><text x="764" y="182" font-size="18" font-weight="400" fill="#17324d">고정한 조건에서의 관찰</text><text x="764" y="221" font-size="20" font-weight="700" fill="#17324d">shape · 시간 · 생성문</text><text x="764" y="270" font-size="17" font-weight="400" fill="#17324d">확인: 그 실행에서 얻은 결과</text><text x="764" y="306" font-size="17" font-weight="400" fill="#506477">아직 모름: 모든 입력의 성능</text><path d="M359 224 L383 224" fill="none" stroke="#17324d" stroke-width="2.2" marker-end="url(#arrow)" /><path d="M715 224 L739 224" fill="none" stroke="#17324d" stroke-width="2.2" marker-end="url(#arrow)" /><rect x="34" y="375" width="1032" height="124" rx="12" fill="#fff0d4" stroke="#b4c9df" stroke-width="1.2" /><text x="54" y="407" font-size="21" font-weight="700" fill="#17324d">계산은 별도 근거입니다: 가정 + 공식 → 계산값</text><text x="54" y="440" font-size="18" font-weight="400" fill="#17324d">예: L=36, B=1, T=4096, Hkv=8, Dhead=128, FP16 → 표준 GQA의 KV 계산값 576 MiB</text><text x="54" y="475" font-size="18" font-weight="400" fill="#17324d">총 VRAM 측정값이나 실행 가능 판정이 아닙니다. 자료가 없는 결론은 [미확인]으로 남깁니다.</text></g></svg>
