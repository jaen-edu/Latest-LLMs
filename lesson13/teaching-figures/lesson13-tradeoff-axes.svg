<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="540" viewBox="0 0 1100 540"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#b4c9df"/></marker></defs><g font-family="Noto Sans CJK KR, sans-serif"><text x="34" y="48" font-size="27" font-weight="700" fill="#17324d">“효율적”을 한 가지 숫자로 비교하지 않습니다</text><text x="34" y="80" font-size="17" font-weight="400" fill="#506477">먼저 업무의 병목을 고릅니다. 서로 다른 선택은 서로 다른 비용을 줄입니다.</text><rect x="34" y="115" width="238" height="290" rx="12" fill="#e6f1fc" stroke="#b4c9df" stroke-width="1"/><text x="49" y="148" font-size="21" font-weight="700" fill="#17324d">어텐션 · 캐시</text><text x="49" y="179" font-size="17" font-weight="400" fill="#17324d">GQA · MLA · 지역/전역</text><text x="49" y="225" font-size="16" font-weight="700" fill="#506477">줄이려는 부담</text><text x="49" y="254" font-size="16" font-weight="400" fill="#17324d">KV 저장·읽기 / 비교 범위</text><text x="49" y="310" font-size="16" font-weight="700" fill="#506477">확인할 조건</text><text x="49" y="339" font-size="16" font-weight="400" fill="#17324d">캐시 표현·길이·구현</text><rect x="282" y="115" width="238" height="290" rx="12" fill="#e6f1fc" stroke="#b4c9df" stroke-width="1"/><text x="297" y="148" font-size="21" font-weight="700" fill="#17324d">FFN 계산 경로</text><text x="297" y="179" font-size="17" font-weight="400" fill="#17324d">dense · MoE</text><text x="297" y="225" font-size="16" font-weight="700" fill="#506477">줄이려는 부담</text><text x="297" y="254" font-size="16" font-weight="400" fill="#17324d">토큰당 실행하는 FFN 계산</text><text x="297" y="310" font-size="16" font-weight="700" fill="#506477">확인할 조건</text><text x="297" y="339" font-size="16" font-weight="400" fill="#17324d">전체 가중치·통신 비용</text><rect x="530" y="115" width="238" height="290" rx="12" fill="#e6f1fc" stroke="#b4c9df" stroke-width="1"/><text x="545" y="148" font-size="21" font-weight="700" fill="#17324d">이미지 입력</text><text x="545" y="179" font-size="17" font-weight="400" fill="#17324d">VLM · OCR+LLM</text><text x="545" y="225" font-size="16" font-weight="700" fill="#506477">추가하는 능력</text><text x="545" y="254" font-size="16" font-weight="400" fill="#17324d">시각 정보를 텍스트와 연결</text><text x="545" y="310" font-size="16" font-weight="700" fill="#506477">확인할 조건</text><text x="545" y="339" font-size="16" font-weight="400" fill="#17324d">해상도·시각 토큰·오인식</text><rect x="778" y="115" width="238" height="290" rx="12" fill="#e6f1fc" stroke="#b4c9df" stroke-width="1"/><text x="793" y="148" font-size="21" font-weight="700" fill="#17324d">실행 조건</text><text x="793" y="179" font-size="17" font-weight="400" fill="#17324d">자료형 · 엔진 · 장비</text><text x="793" y="225" font-size="16" font-weight="700" fill="#506477">바꾸는 자원 비용</text><text x="793" y="254" font-size="16" font-weight="400" fill="#17324d">메모리·지연·처리량</text><text x="793" y="310" font-size="16" font-weight="700" fill="#506477">확인할 조건</text><text x="793" y="339" font-size="16" font-weight="400" fill="#17324d">지원 연산·품질·동일 조건</text><rect x="34" y="430" width="982" height="73" rx="12" fill="#fff0d4" stroke="#b4c9df" stroke-width="1"/><text x="52" y="460" font-size="21" font-weight="700" fill="#17324d">선택 메모 = 요구사항 + 구조 근거 + 계산/실행 근거 + 남은 확인</text><text x="52" y="488" font-size="17" font-weight="400" fill="#17324d">활성 파라미터 ≠ 전체 저장량     |     지원 길이 ≠ 장문 정확도     |     작은 캐시 ≠ 항상 빠른 실행</text></g></svg>