<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="540" viewBox="0 0 1100 540"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#17324d" /></marker></defs><g font-family="Noto Sans CJK KR, sans-serif"><text x="34" y="48" font-size="27" font-weight="700" fill="#17324d">내 설명을 “근거 → 주장 → 한계 → 다음 확인”으로 고칩니다</text><text x="34" y="80" font-size="17" font-weight="400" fill="#506477">[문서] · [계산] · [실행]을 분리하면, 단정 대신 검증 가능한 결론을 만들 수 있습니다.</text><rect x="34" y="126" width="244" height="264" rx="12" fill="#e6f1fc" stroke="#b4c9df" stroke-width="1.2" /><text x="49" y="160" font-size="22" font-weight="700" fill="#17324d">1  근거</text><text x="49" y="197" font-size="17" font-weight="700" fill="#17324d">무엇을 확인했나요?</text><text x="49" y="245" font-size="16" font-weight="400" fill="#17324d">[문서] Qwen3-4B GQA</text><text x="49" y="278" font-size="16" font-weight="400" fill="#17324d">[계산] KV = 576 MiB</text><text x="49" y="328" font-size="16" font-weight="400" fill="#17324d">배치 1 · 4096토큰 · FP16</text><rect x="302" y="126" width="244" height="264" rx="12" fill="#e6f1fc" stroke="#b4c9df" stroke-width="1.2" /><text x="317" y="160" font-size="22" font-weight="700" fill="#17324d">2  주장</text><text x="317" y="197" font-size="17" font-weight="700" fill="#17324d">근거가 지지하는 범위</text><text x="317" y="245" font-size="16" font-weight="400" fill="#17324d">이 조건의 표준 KV</text><text x="317" y="278" font-size="16" font-weight="400" fill="#17324d">저장량을 계산했습니다.</text><text x="317" y="328" font-size="16" font-weight="400" fill="#17324d">모델 선택의 한 근거입니다.</text><rect x="570" y="126" width="244" height="264" rx="12" fill="#fff0d4" stroke="#b4c9df" stroke-width="1.2" /><text x="585" y="160" font-size="22" font-weight="700" fill="#17324d">3  한계</text><text x="585" y="197" font-size="17" font-weight="700" fill="#17324d">아직 말할 수 없는 것</text><text x="585" y="245" font-size="16" font-weight="400" fill="#17324d">총 VRAM이 아닙니다.</text><text x="585" y="278" font-size="16" font-weight="400" fill="#17324d">이 장비에서의 속도와</text><text x="585" y="328" font-size="16" font-weight="400" fill="#17324d">한국어 품질은 미확인입니다.</text><rect x="838" y="126" width="228" height="264" rx="12" fill="#e6f1fc" stroke="#b4c9df" stroke-width="1.2" /><text x="853" y="160" font-size="22" font-weight="700" fill="#17324d">4  다음 확인</text><text x="853" y="197" font-size="17" font-weight="700" fill="#17324d">한 가지 조건만 변경</text><text x="853" y="245" font-size="16" font-weight="400" fill="#17324d">입력 길이만 바꾸고</text><text x="853" y="278" font-size="16" font-weight="400" fill="#17324d">캐시 변화량을 비교합니다.</text><text x="853" y="328" font-size="16" font-weight="400" fill="#17324d">모델·자료형·장비는 고정</text><path d="M278 255 L296 255" fill="none" stroke="#17324d" stroke-width="2.2" marker-end="url(#arrow)" /><path d="M546 255 L564 255" fill="none" stroke="#17324d" stroke-width="2.2" marker-end="url(#arrow)" /><path d="M814 255 L832 255" fill="none" stroke="#17324d" stroke-width="2.2" marker-end="url(#arrow)" /><rect x="34" y="420" width="1032" height="83" rx="12" fill="#e6f1fc" stroke="#b4c9df" stroke-width="1.2" /><text x="54" y="452" font-size="21" font-weight="700" fill="#17324d">출력에 [PASS]가 있어도, 무엇을 검사했는지 먼저 읽으세요.</text><text x="54" y="484" font-size="18" font-weight="400" fill="#17324d">구조·수치 일치 검사 통과 ≠ 생성문의 정답     |     같은 입력의 관찰 ≠ 모든 입력의 품질</text></g></svg>
